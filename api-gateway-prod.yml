# ─────────────────────────────────────────────────────────────────────────────
#  api-gateway · prod — sin defaults para Eureka: si falta EUREKA_URI, la gateway
#  NO arranca (fail fast) en lugar de quedar sin saber adónde enrutar.
# ─────────────────────────────────────────────────────────────────────────────
eureka:
  client:
    enabled: true
    service-url:
      # http://<usuario>:<contraseña>@eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URI}
  instance:
    # Nombre del servicio en compose, resoluble en la red app-prod-services. Con varias
    # redes, prefer-ip-address podría anunciar una IP que el resto no alcanza.
    hostname: api-gateway

rrhh:
  gateway:
    services:
      # Una URL directa (http://common-service:8080) enruta sin Eureka en una emergencia.
      common-service: ${COMMON_SERVICE_URI:lb://common-service}
      # Una URL directa (http://rrhh-service:8083) enruta sin Eureka en una emergencia.
      rrhh-service: ${RRHH_SERVICE_URI:lb://rrhh-service}

logging:
  level:
    root: INFO
