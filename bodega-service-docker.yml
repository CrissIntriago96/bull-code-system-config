# ─────────────────────────────────────────────────────────────────────────────
#  bodega-service · docker — el servicio dentro de docker compose, con Eureka.
#  Las credenciales llegan por variables de entorno desde docker-compose.yml.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    # "postgres" es el nombre del servicio en compose: jamás localhost entre contenedores.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bodega}
    password: ${DB_PASSWORD:bodega_dev}
  cloud:
    loadbalancer:
      cache:
        # Tras recrear common-service (IP nueva), el JWKS se pide a la IP nueva en segundos.
        ttl: 5s

server:
  # La gateway reenvía X-Forwarded-*: Spring reconstruye esquema y host originales.
  forward-headers-strategy: framework

eureka:
  client:
    enabled: true
    service-url:
      # "eureka-server" es el nombre del servicio en compose. Las credenciales van en la URL.
      defaultZone: ${EUREKA_URI:http://eureka:eureka_dev@eureka-server:8761/eureka/}
    # Local: ver enseguida a common-service (JWKS) tras un reinicio (el default es 30 s).
    registry-fetch-interval-seconds: 5
  instance:
    # En Docker el hostname es el id del contenedor: se registra la IP de la red app-net.
    prefer-ip-address: true
    # Local: la gateway ve a bodega-service (y nota su caída) en segundos, no en 90 s.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
