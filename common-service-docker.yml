# ─────────────────────────────────────────────────────────────────────────────
#  common-service · docker — el servicio dentro de docker compose.
#  Las credenciales llegan por variables de entorno desde docker-compose.yml.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    # "postgres" es el nombre del servicio en compose: jamás localhost entre contenedores.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:common}
  mail:
    # "mailpit" es el servicio de compose que atrapa todos los correos (sin auth ni TLS).
    host: ${MAIL_HOST:mailpit}

server:
  # Nginx reenvía X-Forwarded-*: Spring reconstruye esquema y host originales.
  forward-headers-strategy: framework

eureka:
  client:
    enabled: true
    service-url:
      # "eureka-server" es el nombre del servicio en compose. Las credenciales van en la URL.
      defaultZone: ${EUREKA_URI:http://eureka:eureka_dev@eureka-server:8761/eureka/}
  instance:
    # En Docker el hostname es el id del contenedor: se registra la IP de la red app-net.
    prefer-ip-address: true
    # Local: la gateway ve a common-service (y nota su caída) en segundos, no en 90 s.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

rrhh:
  security:
    jwt:
      # Sin RRHH_JWT_PRIVATE_KEY se firma con una clave efímera: reiniciar el contenedor
      # cierra las sesiones (rrhh-service vuelve a pedir el JWKS solo, por el kid nuevo).
      ephemeral-key-allowed: true
    cookie:
      # Docker Desktop local sirve por http://localhost.
      secure: false
  notification:
    password: ${NOTIFICATION_PASSWORD:notification_dev}
  seed:
    admin:
      enabled: true
      username: admin
      password: ${RRHH_SEED_ADMIN_PASSWORD:admin}
      email: admin@rrhh.local
