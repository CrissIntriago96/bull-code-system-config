# ─────────────────────────────────────────────────────────────────────────────
#  common-service — configuración común a todos los entornos.
#  Lo específico vive en common-service-{dev|docker|prod}.yml.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:common}
    username: ${DB_USER:common}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: common-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la única fuente de verdad del esquema; Hibernate nunca lo toca.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Local y docker usan Mailpit (sin autenticación ni TLS); prod exige su SMTP real.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      # Sin timeouts, un SMTP colgado retiene para siempre los hilos de envío.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

eureka:
  client:
    # Apagado por defecto: dev (híbrido) y prod no tienen Eureka. El perfil docker lo enciende.
    enabled: false
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:eureka_dev@localhost:8761/eureka/}

management:
  health:
    mail:
      # El correo se envía en segundo plano: un SMTP caído no debe marcar la API como caída.
      enabled: false

rrhh:
  security:
    jwt:
      issuer: common-service
      # Sesión normal: expira a las 8 h. "Mantener la sesión iniciada": 7 días.
      session-ttl: 8h
      remember-me-ttl: 7d
      # Firma RS256. Clave RSA privada PKCS#8 (>= 2048 bits), PEM o base64 de una línea.
      # Los demás servicios validan con la pública que publica /.well-known/jwks.json.
      # Sin default acá: prod la exige por env; dev y docker pueden usar una efímera.
      private-key: ${RRHH_JWT_PRIVATE_KEY:}
      # true = sin private-key se genera una clave en memoria al arrancar (cada reinicio
      # cierra las sesiones). Solo los perfiles de desarrollo lo encienden.
      ephemeral-key-allowed: false
    cookie:
      # El JWT viaja en una cookie HttpOnly: JavaScript nunca puede leerlo.
      name: RRHH_SESSION
      path: /api
      same-site: Strict
      secure: true
    mfa:
      # Segundo paso obligatorio: código de 6 dígitos por correo después de la contraseña.
      enabled: ${RRHH_MFA_ENABLED:true}
      login-code-ttl: 3m
      reset-code-ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-resends: 3
      # "Confiar en este dispositivo": el navegador no vuelve a pedir código por 30 días.
      trusted-device-ttl: 30d
      trusted-device-cookie: RRHH_TRUSTED_DEVICE
  mail:
    from: "${MAIL_FROM:RRHH <no-reply@rrhh.local>}"
  notification:
    # remote: los correos los envía notification-service (common-service lo encuentra por Eureka).
    # smtp:   common-service los envía directo por SMTP (comportamiento anterior; transitorio).
    mode: ${NOTIFICATION_MODE:remote}
    username: ${NOTIFICATION_USERNAME:backend}
    # Sin default acá: cada perfil decide de dónde sale (prod lo exige en modo remote).
    password: ${NOTIFICATION_PASSWORD:}
  cors:
    # Vacío = sin CORS. Frontend y API comparten origin vía proxy (Nginx / ng serve).
    allowed-origins: []

# Circuit breakers de los adaptadores de correo: con el destino caído, los envíos se
# descartan al instante en vez de ocupar hilos hasta el timeout. No entregan el correo:
# con el circuito abierto o cerrado, un correo que no salió se pierde igual.
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Pocas llamadas (un correo por login o recuperación): ventana chica.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Menor que mfa.resend-cooldown (60 s): cuando el usuario pide reenviar el código,
        # el circuito ya deja pasar una prueba (half-open).
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
    instances:
      # RemoteAuthMailer (modo remote). Un 4xx no cuenta como falla: el servicio respondió.
      notification-service:
        base-config: default
      # SmtpAuthMailer (modo smtp, transitorio).
      smtp:
        base-config: default
