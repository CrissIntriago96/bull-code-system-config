# ─────────────────────────────────────────────────────────────────────────────
#  notification-service · docker — dentro de docker compose, con Eureka.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  mail:
    # "mailpit" es el servicio de compose que atrapa todos los correos (sin auth ni TLS).
    host: ${MAIL_HOST:mailpit}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka:eureka_dev@eureka-server:8761/eureka/}
  instance:
    # En Docker el hostname es el id del contenedor: se registra la IP de la red app-net.
    prefer-ip-address: true
    # Local: common-service lo ve (y nota su caída) en segundos, no en 90 s.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
