# ─────────────────────────────────────────────────────────────────────────────
#  common-service · dev — el servicio en Windows (IDE / mvn), PostgreSQL en Docker.
#  Todos los valores de acá son SOLO PARA DESARROLLO LOCAL.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    password: ${DB_PASSWORD:common_dev}
  cloud:
    discovery:
      client:
        simple:
          instances:
            # Sin Eureka en modo híbrido: el load balancer resuelve "notification-service" a
            # esta URL fija: el 8082 de Windows, corra con mvn o en Docker (NOTIFICATION_PORT).
            notification-service:
              - uri: http://localhost:8082

rrhh:
  security:
    jwt:
      # Sin RRHH_JWT_PRIVATE_KEY se firma con una clave efímera: reiniciar el servicio
      # cierra las sesiones (rrhh-service vuelve a pedir el JWKS solo, por el kid nuevo).
      ephemeral-key-allowed: true
    cookie:
      # http://localhost no es HTTPS: una cookie Secure no viajaría en todos los navegadores.
      secure: false
  notification:
    password: ${NOTIFICATION_PASSWORD:notification_dev}
  cors:
    # Solo por si alguien llama a la API directo desde ng serve sin proxy.
    allowed-origins:
      - http://localhost:4200
  seed:
    admin:
      enabled: true
      username: admin
      password: ${RRHH_SEED_ADMIN_PASSWORD:admin}
      email: admin@rrhh.local

logging:
  level:
    com.bullcode.app: DEBUG
