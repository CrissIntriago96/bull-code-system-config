# ─────────────────────────────────────────────────────────────────────────────
#  eureka-server · prod — sin defaults para las credenciales: si faltan, Eureka NO arranca.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  security:
    user:
      name: ${EUREKA_USERNAME}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:eureka-server}
  server:
    # Con más instancias, la autopreservación protege el registro ante un corte de red
    # (evita desregistrar todo de golpe). Se deja el comportamiento por defecto.
    enable-self-preservation: true

logging:
  level:
    root: INFO
